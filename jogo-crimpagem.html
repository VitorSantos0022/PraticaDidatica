<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crimpagem RJ-45 3D - SENAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body { background: #0b0f19; color: #fff; overflow: hidden; width: 100vw; height: 100vh; }
    #canvas-container { width: 100vw; height: 100vh; touch-action: none; position: absolute; top: 0; left: 0; }
    
    #ui { 
      position: absolute; 
      top: 15px; 
      left: 15px; 
      z-index: 10; 
      background: rgba(18, 24, 38, 0.95); 
      backdrop-filter: blur(10px); 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 12px; 
      padding: 16px; 
      width: 380px; 
      max-width: calc(100vw - 30px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    h1 { font-size: 1.1rem; color: #58a6ff; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    p.desc { font-size: 0.78rem; color: #8b949e; margin-bottom: 12px; line-height: 1.3; }

    .pattern-selector { display: flex; gap: 6px; margin-bottom: 10px; }
    .pattern-btn { flex: 1; padding: 8px; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; font-weight: bold; font-size: 0.78rem; cursor: pointer; transition: 0.2s; }
    .pattern-btn.active { background: #1f6beb; color: #fff; border-color: #58a6ff; }

    .pins-container { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 10px; background: #0d1117; padding: 6px; border-radius: 6px; border: 1px solid #30363d; }
    .pin-slot { aspect-ratio: 1/2.2; border: 1px dashed #484f58; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 3px 1px; font-size: 0.55rem; font-weight: bold; color: #8b949e; cursor: pointer; text-align: center; word-break: break-word; }

    .color-palette { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px; }
    .color-btn { padding: 8px 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); font-size: 0.72rem; font-weight: bold; color: #fff; text-shadow: 0 1px 2px #000; cursor: pointer; text-align: center; transition: 0.2s; }
    .color-btn:hover { transform: translateY(-1px); }

    .action-group { display: flex; gap: 6px; }
    .btn-act { flex: 1; padding: 9px; border-radius: 6px; border: none; font-weight: bold; font-size: 0.78rem; cursor: pointer; text-align: center; text-decoration: none; transition: 0.2s; }
    .btn-ver { background: #238636; color: #fff; }
    .btn-ver:hover, .btn-ver:active { background: #2ea043; }
    .btn-res { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    .btn-res:hover, .btn-res:active { background: #30363d; color: #fff; }
    .btn-nav { background: #30363d; color: #ccc; }
    .btn-nav:hover, .btn-nav:active { background: #484f58; color: #fff; }

    #status { margin-top: 10px; padding: 8px; border-radius: 6px; font-size: 0.78rem; text-align: center; font-weight: bold; display: none; }

    @media (max-width: 600px) {
      #ui { top: auto; bottom: 12px; left: 50%; transform: translateX(-50%); width: 94vw; padding: 12px; }
      h1 { font-size: 0.95rem; }
      p.desc { font-size: 0.72rem; margin-bottom: 8px; }
      .color-btn { padding: 6px 4px; font-size: 0.68rem; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="ui">
    <h1>🔌 Crimpagem RJ-45 3D</h1>
    <p class="desc">Escolha a norma e selecione as cores na ordem exata dos 8 pinos:</p>
    
    <div class="pattern-selector">
      <button class="pattern-btn active" id="btnA" onclick="setPattern('T568A')">Norma T568A</button>
      <button class="pattern-btn" id="btnB" onclick="setPattern('T568B')">Norma T568B</button>
    </div>

    <div class="pins-container" id="pins"></div>
    <div class="color-palette" id="palette"></div>

    <div class="action-group">
      <a href="index.html" class="btn-act btn-nav">⬅️ Menu</a>
      <button class="btn-act btn-res" onclick="resetGame()">🔄 Limpar</button>
      <button class="btn-act btn-ver" onclick="verifyCrimp()">✅ Testar</button>
    </div>
    
    <div id="status"></div>
  </div>

  <div id="canvas-container"></div>

  <script>
    const COLORS = {
      'Verde/Branco':  { hex: 0x90ee90, bg: 'linear-gradient(135deg, #ffffff 45%, #2ea043 55%)', txt: '#000' },
      'Verde':         { hex: 0x2ea043, bg: '#2ea043', txt: '#fff' },
      'Laranja/Branco':{ hex: 0xffa500, bg: 'linear-gradient(135deg, #ffffff 45%, #ff7b72 55%)', txt: '#000' },
      'Azul':          { hex: 0x1f6beb, bg: '#1f6beb', txt: '#fff' },
      'Azul/Branco':   { hex: 0xadd8e6, bg: 'linear-gradient(135deg, #ffffff 45%, #1f6beb 55%)', txt: '#000' },
      'Laranja':       { hex: 0xff7b72, bg: '#ff7b72', txt: '#fff' },
      'Marrom/Branco': { hex: 0xd2b48c, bg: 'linear-gradient(135deg, #ffffff 45%, #8b4513 55%)', txt: '#000' },
      'Marrom':        { hex: 0x8b4513, bg: '#8b4513', txt: '#fff' }
    };

    const PATTERNS = {
      'T568A': ['Verde/Branco', 'Verde', 'Laranja/Branco', 'Azul', 'Azul/Branco', 'Laranja', 'Marrom/Branco', 'Marrom'],
      'T568B': ['Laranja/Branco', 'Laranja', 'Verde/Branco', 'Azul', 'Azul/Branco', 'Verde', 'Marrom/Branco', 'Marrom']
    };

    let currentPat = 'T568A';
    let userOrder = Array(8).fill(null);

    function initUI() {
      const pEl = document.getElementById('pins');
      pEl.innerHTML = '';
      for(let i = 0; i < 8; i++) {
        pEl.innerHTML += `<div class="pin-slot" id="pin-${i}" onclick="removeWire(${i})"><span>P${i+1}</span></div>`;
      }
      const palEl = document.getElementById('palette');
      palEl.innerHTML = '';
      Object.keys(COLORS).forEach(name => {
        palEl.innerHTML += `<div class="color-btn" style="background:${COLORS[name].bg};color:${COLORS[name].txt}" onclick="addWire('${name}')">${name}</div>`;
      });
    }

    function setPattern(p) {
      currentPat = p;
      document.getElementById('btnA').className = `pattern-btn ${p==='T568A'?'active':''}`;
      document.getElementById('btnB').className = `pattern-btn ${p==='T568B'?'active':''}`;
      resetGame();
    }

    function addWire(name) {
      const idx = userOrder.indexOf(null);
      if(idx !== -1) { userOrder[idx] = name; updateUI(); update3D(); }
    }
    function removeWire(i) { userOrder[i] = null; updateUI(); update3D(); }
    
    function resetGame() {
      userOrder.fill(null);
      document.getElementById('status').style.display = 'none';
      updateUI(); update3D();
    }

    function updateUI() {
      userOrder.forEach((name, i) => {
        const el = document.getElementById(`pin-${i}`);
        if(name) {
          el.style.background = COLORS[name].bg;
          el.style.color = COLORS[name].txt;
          el.innerHTML = `<span>P${i+1}</span><span style="font-size:0.5rem">${name}</span>`;
        } else {
          el.style.background = 'transparent';
          el.style.color = '#8b949e';
          el.innerHTML = `<span>P${i+1}</span>`;
        }
      });
    }

    function verifyCrimp() {
      const st = document.getElementById('status');
      st.style.display = 'block';
      if(userOrder.includes(null)) {
        st.style.background = 'rgba(248,81,73,0.2)'; st.style.color = '#f85149';
        st.innerText = '⚠️ Preencha os 8 pinos do conector!';
        return;
      }
      const ok = userOrder.every((v, i) => v === PATTERNS[currentPat][i]);
      if(ok) {
        st.style.background = 'rgba(46,160,67,0.2)'; st.style.color = '#3fb950';
        st.innerText = `🎉 Crimpagem ${currentPat} CORRETA!`;
      } else {
        st.style.background = 'rgba(248,81,73,0.2)'; st.style.color = '#f85149';
        st.innerText = `❌ Sequência incorreta para ${currentPat}!`;
      }
    }

    let scene, camera, renderer, controls, wireMeshes = [];
    const MODEL_Y_OFFSET = -0.8;

    window.addEventListener('load', () => {
      const c = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

      if(window.innerWidth > 600) {
        camera.position.set(1.2, MODEL_Y_OFFSET + 1.5, 6.5);
      } else {
        camera.position.set(0, MODEL_Y_OFFSET + 2.2, 7.5);
      }

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      c.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, MODEL_Y_OFFSET, 0);
      controls.enableDamping = true;

      scene.add(new THREE.AmbientLight(0xffffff, 0.9));
      
      const rjMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, roughness: 0.1, transmission: 0.9 });
      const rj = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.2, 3), rjMat);
      rj.position.y = MODEL_Y_OFFSET;
      scene.add(rj);

      for(let i = 0; i < 8; i++) {
        const pin = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.8), new THREE.MeshStandardMaterial({ color: 0xb8860b, metalness: 0.9 }));
        pin.position.set(-1.05 + (i * 0.3), MODEL_Y_OFFSET + 0.6, 0.8);
        scene.add(pin);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      initUI();
      animate();
    });

    function update3D() {
      wireMeshes.forEach(m => scene.remove(m));
      wireMeshes = [];
      userOrder.forEach((name, i) => {
        if(name) {
          const w = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 3.5, 12), new THREE.MeshStandardMaterial({ color: COLORS[name].hex }));
          w.rotation.x = Math.PI / 2;
          w.position.set(-1.05 + (i * 0.3), MODEL_Y_OFFSET, 0.5);
          scene.add(w);
          wireMeshes.push(w);
        }
      });
    }
  </script>
</body>
</html>
