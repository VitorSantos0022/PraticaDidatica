<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogo 2: Diagnóstico de Falhas - SENAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { background: #0b0f19; color: #fff; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; touch-action: none; }
    
    #ui {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
      background: rgba(18, 24, 38, 0.92); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
      padding: 14px; max-width: 420px; margin: 0 auto;
    }
    h1 { font-size: 1.1rem; color: #58a6ff; text-align: center; margin-bottom: 4px; }
    p.desc { font-size: 0.8rem; color: #8b949e; text-align: center; margin-bottom: 10px; }
    
    .alert-box { background: rgba(218, 54, 51, 0.2); border: 1px solid #da3633; padding: 10px; border-radius: 6px; font-size: 0.8rem; margin-bottom: 10px; }
    
    .options { display: flex; flex-direction: column; gap: 6px; }
    .opt-btn { padding: 10px; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-align: left; }
    .opt-btn:active { background: #30363d; }
    
    .controls { display: flex; gap: 8px; margin-top: 10px; }
    a.btn-back { flex: 1; padding: 8px; background: #30363d; color: #fff; text-decoration: none; text-align: center; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui">
    <h1>🛠️ Diagnóstico de Falhas (Troubleshooting)</h1>
    <p class="desc">A estação de trabalho perdeu acesso à rede. Use a ferramenta virtual para encontrar a causa:</p>

    <div class="alert-box" id="status">
      <b>🚨 Status da Rede:</b> Link Down (Sem sinal de link no Switch).
    </div>

    <div class="options">
      <button class="opt-btn" onclick="testTool('tester')">🔍 1. Aplicar Testador de Cabos (Continuity)</button>
      <button class="opt-btn" onclick="testTool('switch')">⚡ 2. Verificar LED da Porta no Switch</button>
      <button class="opt-btn" onclick="testTool('solution')">🛠️ 3. Trocar o Patch Cord danificado</button>
    </div>

    <div class="controls">
      <a href="index.html" class="btn-back">⬅️ Voltar ao Menu</a>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0b0f19, 0.03);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));

    // Mesa de Trabalho + Testador Fluke
    const table = new THREE.Mesh(new THREE.BoxGeometry(5, 0.1, 3), new THREE.MeshStandardMaterial({ color: 0x333333 }));
    table.position.y = -0.5;
    scene.add(table);

    // Testador de Cabos Amarelo
    const tester = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.3), new THREE.MeshStandardMaterial({ color: 0xffcc00 }));
    tester.position.set(-1, 0.2, 0);
    scene.add(tester);

    // Cabo UTP com Rompimento
    const cableMat = new THREE.MeshStandardMaterial({ color: 0xda3633 });
    const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3), cableMat);
    cable.rotation.z = Math.PI / 2;
    cable.position.set(0.5, 0, 0);
    scene.add(cable);

    function testTool(action) {
      const status = document.getElementById('status');
      if(action === 'tester') {
        status.className = 'alert-box';
        status.style.borderColor = '#ffcc00';
        status.innerHTML = '<b>🔍 Resultado do Testador:</b> Rompimento de par (Open Pair) no pino 3 (Verde/Branco) do Patch Cord!';
        cableMat.color.setHex(0xffcc00);
      } else if(action === 'switch') {
        status.className = 'alert-box';
        status.innerHTML = '<b>⚡ Inspeção do Switch:</b> LED da Porta 05 apagado devido à ausência de continuidade elétrica.';
      } else if(action === 'solution') {
        status.className = 'alert-box';
        status.style.background = 'rgba(46, 160, 67, 0.2)';
        status.style.borderColor = '#2ea043';
        status.innerHTML = '<b>🎉 PROBLEMA RESOLVIDO!</b> O Patch Cord foi substituído por um Cat6 novo. Link Gigabit restabelecido!';
        cableMat.color.setHex(0x2ea043);
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
