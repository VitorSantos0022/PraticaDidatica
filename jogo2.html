<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Diagnóstico de Falhas 3D - SENAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body { background: #0b0f19; color: #fff; overflow: hidden; width: 100vw; height: 100vh; }
    #canvas-container { width: 100vw; height: 100vh; touch-action: none; position: absolute; top: 0; left: 0; }
    
    /* Painel lateral no PC (Esquerda) e responsivo no Celular */
    #ui { 
      position: absolute; 
      top: 15px; 
      left: 15px; 
      z-index: 10; 
      background: rgba(18, 24, 38, 0.95); 
      backdrop-filter: blur(10px); 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 12px; 
      padding: 16px; 
      width: 350px; 
      max-width: calc(100vw - 30px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    h1 { font-size: 1.1rem; color: #58a6ff; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    p.desc { font-size: 0.78rem; color: #8b949e; margin-bottom: 12px; line-height: 1.3; }
    
    .badge { display: inline-block; background: #1f6beb; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; margin-bottom: 8px; }

    .problem-box { 
      background: #161b22; 
      border: 1px solid #30363d; 
      border-left: 4px solid #da3633; 
      padding: 10px; 
      border-radius: 8px; 
      font-size: 0.8rem; 
      margin-bottom: 12px; 
    }
    .problem-title { font-weight: bold; color: #f85149; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 4px; }
    .problem-desc { color: #e6edf3; font-size: 0.82rem; line-height: 1.3; }

    .action-label { font-size: 0.72rem; color: #8b949e; text-transform: uppercase; font-weight: bold; margin-bottom: 6px; }
    .opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .btn-opt { padding: 9px 10px; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; font-size: 0.78rem; font-weight: bold; cursor: pointer; text-align: left; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .btn-opt:hover, .btn-opt:active { background: #30363d; color: #fff; border-color: #58a6ff; }

    .controls { display: flex; gap: 8px; }
    .btn { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: bold; font-size: 0.8rem; cursor: pointer; text-align: center; text-decoration: none; transition: 0.2s; }
    .btn-res { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
    .btn-res:hover, .btn-res:active { background: #30363d; color: #fff; }
    .btn-nav { background: #30363d; color: #ccc; }
    .btn-nav:hover, .btn-nav:active { background: #484f58; color: #fff; }

    /* Ajustes para telas de Celular */
    @media (max-width: 600px) {
      #ui { 
        top: auto; 
        bottom: 12px; 
        left: 50%; 
        transform: translateX(-50%); 
        width: 92vw; 
        padding: 12px;
      }
      h1 { font-size: 0.95rem; }
      p.desc { font-size: 0.72rem; margin-bottom: 8px; }
      .problem-box { padding: 8px; margin-bottom: 8px; }
      .btn-opt { padding: 8px; font-size: 0.75rem; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="ui">
    <h1>🛠️ Diagnóstico de Falhas 3D</h1>
    <p class="desc">Analise o problema físico da rede, utilize as ferramentas de medição e aplique a solução correta:</p>

    <div class="badge" id="case-progress">CASO 1 DE 4</div>
    <div class="problem-box" id="p-box">
      <div class="problem-title" id="p-title">Sintoma Registrado</div>
      <div class="problem-desc" id="p-desc">Carregando cenário...</div>
    </div>

    <div class="action-label">Ações de Diagnóstico e Reparo:</div>
    <div class="opts" id="actions-container"></div>

    <div class="controls">
      <a href="index.html" class="btn btn-nav">⬅️ Menu</a>
      <button class="btn btn-res" onclick="restartCases()">🔄 Reiniciar Diagnósticos</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    const FAULTS = [
      {
        id: 1,
        title: "Caso 1: Estação Sem Conexão (Link Down)",
        symptom: "O computador da recepção perdeu a rede repentinamente. O LED da placa de rede está totalmente apagado.",
        actions: [
          { txt: "🔍 Usar Testador de Cabo RJ-45", res: "Testador aponta pino 3 (Verde/Branco) sem continuidade. Fio quebrado interno!", color: "#ffcc00", state: "diagnosed" },
          { txt: "⚡ Verificar o Switch da Sala", res: "Porta do Switch intacta e funcionando normalmente para outros ramais.", color: "#8b949e", state: "normal" },
          { txt: "🛠️ Solução: Substituir o Patch Cord Danificado", res: "🎉 SUCESSO! Cabo substituído por um certificado CAT6. Link de 1 Gbps estabelecido!", color: "#2ea043", state: "solved" }
        ],
        cableColor: 0xda3633 // Vermelho (com defeito)
      },
      {
        id: 2,
        title: "Caso 2: Lentidão Severa & Perda de Pacotes",
        symptom: "A impressora de rede funciona em 10 Mbps e apresenta constante perda de pacotes durante grandes impressões.",
        actions: [
          { txt: "🔍 Inspecionar Instalação no Teto", res: "Cabo UTP está enrolado junto com fios de alta tensão de um ar-condicionado!", color: "#ffcc00", state: "diagnosed" },
          { txt: "⚡ Testar com Notebook Direto no Switch", res: "Conexão no Switch funciona em 1000 Mbps normalmente.", color: "#8b949e", state: "normal" },
          { txt: "🛠️ Solução: Reorganizar Rota do Cabo (Afastar da EMI)", res: "🎉 SUCESSO! Cabo movido para calha exclusiva. Interferência eletromagnética zerada!", color: "#2ea043", state: "solved" }
        ],
        cableColor: 0xffa500 // Laranja (Alerta de interferência)
      },
      {
        id: 3,
        title: "Caso 3: Mau Contato na Tomada Keystone",
        symptom: "A rede só funciona quando o usuário balança o cabo que está conectado à tomada fêmea na parede.",
        actions: [
          { txt: "🔍 Abrir Espelho e Inspecionar Keystone", res: "A lâmina Punchdown do conector Keystone está frouxa e oxidada.", color: "#ffcc00", state: "diagnosed" },
          { txt: "⚡ Substituir o Cabo RJ-45 do PC", res: "O problema persiste. O defeito está na tomada da parede.", color: "#8b949e", state: "normal" },
          { txt: "🛠️ Solução: Refazer a Crimpagem na Keystone 110", res: "🎉 SUCESSO! Conector Keystone novo crimpado no padrão T568A. Conexão firme!", color: "#2ea043", state: "solved" }
        ],
        cableColor: 0xf2994a // Laranja Claro (Mau contato)
      },
      {
        id: 4,
        title: "Caso 4: Distância Excedida (Atenuação)",
        symptom: "Link caindo a cada 5 minutos no galpão de estoque distante.",
        actions: [
          { txt: "🔍 Usar Certificador/TDR para Medir Distância", res: "O lance de cabo UTP possui 135 metros contínuos! (Limite ANSI/TIA = 90m + 10m).", color: "#ffcc00", state: "diagnosed" },
          { txt: "⚡ Substituir os Conectores RJ-45", res: "Não resolve. O sinal sofre atenuação excessiva pelo comprimento do cabo.", color: "#8b949e", state: "normal" },
          { txt: "🛠️ Solução: Instalar Switch Intermediário / Repetidor", res: "🎉 SUCESSO! Switch repetidor instalado aos 70 metros. Sinal regenerado com sucesso!", color: "#2ea043", state: "solved" }
        ],
        cableColor: 0xda3633 // Vermelho
      }
    ];

    let currentFaultIdx = 0;
    let scene, camera, renderer, controls, cableMesh, testerMesh, statusLed;

    function renderCase() {
      const f = FAULTS[currentFaultIdx];
      document.getElementById('case-progress').innerText = `CASO ${f.id} DE ${FAULTS.length}`;
      document.getElementById('p-title').innerText = f.title;
      document.getElementById('p-desc').innerText = f.symptom;

      const optsEl = document.getElementById('actions-container');
      optsEl.innerHTML = '';

      f.actions.forEach((act, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.innerHTML = act.txt;
        btn.onclick = () => executeAction(act);
        optsEl.appendChild(btn);
      });

      if(cableMesh) {
        cableMesh.material.color.setHex(f.cableColor);
      }
      if(statusLed) {
        statusLed.material.color.setHex(0xda3633); // LED Vermelho por padrão no início
      }
    }

    function executeAction(act) {
      const pBox = document.getElementById('p-box');
      const pTitle = document.getElementById('p-title');
      const pDesc = document.getElementById('p-desc');

      pDesc.innerHTML = act.res;

      if(act.state === 'solved') {
        pBox.style.borderLeftColor = '#2ea043';
        pTitle.style.color = '#3fb950';
        pTitle.innerText = "Resultado da Ação";
        
        if(cableMesh) cableMesh.material.color.setHex(0x2ea043); // Verde (Corrigido)
        if(statusLed) statusLed.material.color.setHex(0x00ff00); // LED Verde

        if(currentFaultIdx < FAULTS.length - 1) {
          setTimeout(() => {
            currentFaultIdx++;
            pBox.style.borderLeftColor = '#da3633';
            pTitle.style.color = '#f85149';
            renderCase();
          }, 2500);
        } else {
          setTimeout(() => {
            pTitle.innerText = "🏆 Treinamento Concluído";
            pDesc.innerHTML = "<b>Parabéns!</b> Você resolveu todos os diagnósticos físicos de cabeamento estruturado!";
          }, 1000);
        }
      } else {
        pBox.style.borderLeftColor = act.color;
        pTitle.style.color = act.color;
        pTitle.innerText = "Análise / Diagnóstico";
      }
    }

    window.addEventListener('load', () => {
      const c = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

      // Posicionamento ajustado da câmera para desktop/mobile
      if(window.innerWidth > 600) {
        camera.position.set(1.2, 1.5, 5.5);
      } else {
        camera.position.set(0, 1.8, 6.5);
      }

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      c.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      scene.add(new THREE.AmbientLight(0xffffff, 0.9));

      // Bancada / Mesa de Testes 3D
      const bench = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.1, 2.5), new THREE.MeshStandardMaterial({ color: 0x1f242d }));
      bench.position.y = -0.5;
      scene.add(bench);

      // Testador de Cabo (Amarelo)
      testerMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.3), new THREE.MeshStandardMaterial({ color: 0xf2994a }));
      testerMesh.position.set(-1.2, 0.2, 0);
      scene.add(testerMesh);

      // LED de Status no Testador
      statusLed = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), new THREE.MeshBasicMaterial({ color: 0xda3633 }));
      statusLed.position.set(-1.2, 0.7, 0.16);
      scene.add(statusLed);

      // Cabo UTP sob Análise
      const cableGeom = new THREE.CylinderGeometry(0.06, 0.06, 2.8, 16);
      const cableMat = new THREE.MeshStandardMaterial({ color: FAULTS[0].cableColor });
      cableMesh = new THREE.Mesh(cableGeom, cableMat);
      cableMesh.rotation.z = Math.PI / 2;
      cableMesh.position.set(0.6, 0, 0);
      scene.add(cableMesh);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      renderCase();
      animate();
    });

    function restartCases() {
      currentFaultIdx = 0;
      document.getElementById('p-box').style.borderLeftColor = '#da3633';
      document.getElementById('p-title').style.color = '#f85149';
      renderCase();
    }
  </script>
</body>
</html>
