<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogo 1: Patching no Switch 3D - SENAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; user-select: none; }
    body { background: #0b0f19; color: #fff; overflow: hidden; width: 100vw; height: 100vh; }
    #canvas-container { width: 100vw; height: 100vh; touch-action: none; }
    
    #ui {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
      background: rgba(18, 24, 38, 0.92); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
      padding: 14px; max-width: 420px; margin: 0 auto; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    h1 { font-size: 1.1rem; color: #58a6ff; text-align: center; margin-bottom: 4px; }
    p.desc { font-size: 0.8rem; color: #8b949e; text-align: center; margin-bottom: 10px; }
    
    .mission-box { background: #161b22; border-left: 3px solid #f2994a; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 0.8rem; }
    .status-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-top: 4px; }
    
    .controls { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 10px; border-radius: 6px; border: none; font-weight: bold; font-size: 0.8rem; cursor: pointer; }
    .btn-reset { background: #da3633; color: #fff; }
    .btn-back { background: #30363d; color: #c9d1d9; text-decoration: none; text-align: center; line-height: 20px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui">
    <h1>🎛️ Desafio de Patching & Switch</h1>
    <p class="desc">Toque na porta do Patch Panel (Cima) e depois na porta correspondente do Switch (Baixo):</p>

    <div class="mission-box" id="mission">
      <b>Missão 1:</b> Conecte o Patch Panel 02 (TI) na Porta 02 do Switch (VLAN 10).
    </div>

    <div class="controls">
      <a href="index.html" class="btn-back">⬅️ Voltar</a>
      <button class="btn-reset" onclick="resetGame()">🔄 Reiniciar</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // Configuração de Cena
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0b0f19, 0.03);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    // Patch Panel e Switch 3D
    const rackGroup = new THREE.Group();
    
    // Panel (Cima)
    const patchPanel = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.6, 0.8), new THREE.MeshStandardMaterial({ color: 0x222222 }));
    patchPanel.position.set(0, 1.2, 0);
    rackGroup.add(patchPanel);

    // Switch (Baixo)
    const switchMesh = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.6, 0.8), new THREE.MeshStandardMaterial({ color: 0x004488 }));
    switchMesh.position.set(0, -1.2, 0);
    rackGroup.add(switchMesh);

    scene.add(rackGroup);

    // Criando Portas Interativas
    const portsPP = [];
    const portsSW = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    for(let i=0; i<8; i++) {
      // Portas Patch Panel
      const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), new THREE.MeshStandardMaterial({ color: 0x555555 }));
      p1.position.set(-1.75 + (i * 0.5), 1.2, 0.41);
      p1.userData = { type: 'PP', id: i + 1 };
      rackGroup.add(p1);
      portsPP.push(p1);

      // Portas Switch
      const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), new THREE.MeshStandardMaterial({ color: 0x111111 }));
      p2.position.set(-1.75 + (i * 0.5), -1.2, 0.41);
      p2.userData = { type: 'SW', id: i + 1 };
      rackGroup.add(p2);
      portsSW.push(p2);

      // LEDs do Switch
      const led = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), new THREE.MeshBasicMaterial({ color: 0x333333 }));
      led.position.set(-1.75 + (i * 0.5), -0.95, 0.41);
      led.name = `led-${i+1}`;
      rackGroup.add(led);
    }

    let selectedPP = null;
    let cables = [];

    // Lógica de Toque/Clique 3D
    window.addEventListener('pointerdown', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(rackGroup.children);
      if(intersects.length > 0) {
        const obj = intersects[0].object;
        if(obj.userData.type === 'PP') {
          if(selectedPP) selectedPP.material.color.setHex(0x555555);
          selectedPP = obj;
          obj.material.color.setHex(0x00ff88);
        } else if(obj.userData.type === 'SW' && selectedPP) {
          createCable(selectedPP, obj);
          selectedPP.material.color.setHex(0x555555);
          selectedPP = null;
        }
      }
    });

    function createCable(pp, sw) {
      const curve = new THREE.CatmullRomCurve3([
        pp.position.clone().add(new THREE.Vector3(0,0,0.1)),
        new THREE.Vector3((pp.position.x + sw.position.x)/2, 0, 1.2),
        sw.position.clone().add(new THREE.Vector3(0,0,0.1))
      ]);
      const cableMat = new THREE.MeshStandardMaterial({ color: 0x1f6beb });
      const cable = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.04, 8, false), cableMat);
      scene.add(cable);
      cables.push(cable);

      // Validação de Conexão
      const led = rackGroup.getObjectByName(`led-${sw.userData.id}`);
      if(pp.userData.id === sw.userData.id) {
        led.material.color.setHex(0x00ff00); // Sucesso
        document.getElementById('mission').innerHTML = `<b>🎉 Excelente!</b> Patch Cord conectado com sucesso na Porta ${sw.userData.id}! Link Ativo.`;
      } else {
        led.material.color.setHex(0xff0000); // Erro
        document.getElementById('mission').innerHTML = `<b>⚠️ Atenção:</b> Conexão cruzada! O Patch Panel ${pp.userData.id} foi ligado na porta ${sw.userData.id}.`;
      }
    }

    function resetGame() {
      cables.forEach(c => scene.remove(c));
      cables = [];
      portsSW.forEach(p => {
        const led = rackGroup.getObjectByName(`led-${p.userData.id}`);
        led.material.color.setHex(0x333333);
      });
      document.getElementById('mission').innerHTML = `<b>Missão 1:</b> Conecte o Patch Panel 02 (TI) na Porta 02 do Switch (VLAN 10).`;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
